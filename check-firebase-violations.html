<!DOCTYPE html>
<html>
<head>
    <title>Check Firebase Violations</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .result { border: 1px solid #ccc; padding: 10px; margin-top: 10px; background: #f5f5f5; white-space: pre-wrap; font-family: monospace; max-height: 500px; overflow-y: auto; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Check Firebase Violations</h1>
    
    <div>
        <button onclick="checkViolations()">Check Violations</button>
        <button onclick="checkHasil()">Check Hasil</button>
        <button onclick="clearResult()">Clear</button>
    </div>
    
    <div class="result" id="result"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDvKvKvKvKvKvKvKvKvKvKvKvKvKvKvKvKvKv",
            authDomain: "cbtmo-firebase.firebaseapp.com",
            databaseURL: "https://cbtmo-firebase.firebaseio.com",
            projectId: "cbtmo-firebase",
            storageBucket: "cbtmo-firebase.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdefghijklmnop"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function log(msg, className = 'info') {
            const resultEl = document.getElementById('result');
            resultEl.innerHTML += `<div class="${className}">${msg}</div>`;
            resultEl.scrollTop = resultEl.scrollHeight;
        }

        function clearResult() {
            document.getElementById('result').innerHTML = '';
        }

        async function checkViolations() {
            clearResult();
            log('🔍 Checking Firebase violations...', 'info');
            
            try {
                const ref = db.ref('/pelanggaran');
                const snap = await ref.once('value');
                const data = snap.val();
                
                if (!data) {
                    log('❌ No violations found in Firebase', 'error');
                    return;
                }
                
                const violations = Object.entries(data);
                log(`✅ Found ${violations.length} violations in Firebase`, 'success');
                log('', 'info');
                
                violations.forEach(([key, v], idx) => {
                    log(`\n[${idx + 1}] Key: ${key}`, 'info');
                    log(JSON.stringify(v, null, 2), 'info');
                });
            } catch (e) {
                log(`❌ Error: ${e.message}`, 'error');
            }
        }

        async function checkHasil() {
            clearResult();
            log('🔍 Checking Firebase hasil...', 'info');
            
            try {
                const ref = db.ref('/hasil');
                const snap = await ref.once('value');
                const data = snap.val();
                
                if (!data) {
                    log('❌ No hasil found in Firebase', 'error');
                    return;
                }
                
                const hasil = Object.entries(data);
                log(`✅ Found ${hasil.length} hasil in Firebase`, 'success');
                log('', 'info');
                
                // Show first 5 only
                hasil.slice(0, 5).forEach(([key, h], idx) => {
                    log(`\n[${idx + 1}] Key: ${key}`, 'info');
                    log(`  Nama: ${h.nama}`, 'info');
                    log(`  Kelas: ${h.kelas}`, 'info');
                    log(`  Skor: ${h.skor}`, 'info');
                    log(`  Exam: ${h.exam_id}`, 'info');
                });
                
                if (hasil.length > 5) {
                    log(`\n... and ${hasil.length - 5} more`, 'info');
                }
            } catch (e) {
                log(`❌ Error: ${e.message}`, 'error');
            }
        }
    </script>
</body>
</html>
