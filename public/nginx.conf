# PHASE 8: NGINX LOAD BALANCING\n# Performance: Support 10x more users, 99.9% uptime\n\nupstream backend {\n    least_conn;\n    server backend1:3000 weight=1;\n    server backend2:3000 weight=1;\n    server backend3:3000 weight=1;\n    keepalive 32;\n}\n\nupstream websocket {\n    server ws1:8080;\n    server ws2:8080;\n    server ws3:8080;\n}\n\nserver {\n    listen 80;\n    server_name cbtmo.local;\n    \n    # Redirect to HTTPS\n    return 301 https://$server_name$request_uri;\n}\n\nserver {\n    listen 443 ssl http2;\n    server_name cbtmo.local;\n    \n    ssl_certificate /etc/ssl/certs/cbtmo.crt;\n    ssl_certificate_key /etc/ssl/private/cbtmo.key;\n    ssl_protocols TLSv1.2 TLSv1.3;\n    ssl_ciphers HIGH:!aNULL:!MD5;\n    \n    # Gzip compression\n    gzip on;\n    gzip_types text/plain text/css application/json application/javascript;\n    gzip_min_length 1000;\n    \n    # Cache static assets\n    location ~* \\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {\n        expires 30d;\n        add_header Cache-Control \"public, immutable\";\n    }\n    \n    # WebSocket\n    location /ws {\n        proxy_pass http://websocket;\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection \"upgrade\";\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n    \n    # API\n    location /api/ {\n        proxy_pass http://backend;\n        proxy_http_version 1.1;\n        proxy_set_header Connection \"\";\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_cache_bypass $http_upgrade;\n    }\n    \n    # Static files\n    location / {\n        root /var/www/cbtmo;\n        try_files $uri $uri/ /index.html;\n    }\n}\n