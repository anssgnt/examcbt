<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ujian - CBT Online</title>

  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <link rel="stylesheet" href="style.css?v=2">

</head>

<body oncontextmenu="return false;" class="exam-page">

  <!-- ══════════════════════════════════════
     EXAM VIEW
  ══════════════════════════════════════ -->
  <div id="exam-view" class="view active exam-layout">

    <!-- Header -->
    <div class="modern-exam-header">
      <div class="header-left">
        <button id="btnGrid" class="header-menu-btn" title="Grid Soal">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>
          </svg>
        </button>
        <div class="header-info">
          <div id="exam-title" class="exam-main-title">Ujian</div>
          <div id="exam-user-info" class="exam-status-sub">-</div>
        </div>
      </div>
      <div class="modern-timer">
        <div id="exam-timer" class="timer-value">00:00:00</div>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="exam-progress-area">
      <div class="progress-labels">
        <span id="q-progress-text">SOAL 1 / 10 (PG)</span>
        <span id="q-percentage">0%</span>
      </div>
      <div class="modern-progress-bg">
        <div id="q-progress-bar" class="modern-progress-fill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Question Content -->
    <div class="exam-content-scrollable">
      <div class="question-wrapper">
        <div id="q-type-badge" class="q-type-badge">PG</div>
        <div id="q-instruction" class="q-instruction-text"></div>
        <div id="q-text" class="modern-question-text"></div>
        <div id="q-image-container" class="question-image-wrapper" style="display:none;"></div>
        <div id="q-options" class="modern-answer-area"></div>
      </div>
    </div>

    <!-- Footer Navigation -->
    <div class="modern-footer">
      <div class="footer-actions">
        <button id="btnDoubt" class="btn-footer-warning">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M3 21h18M9 8h2m-2 4h2m4-8h.01M17 16v.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          Ragu
        </button>
        <button id="btnPrev" class="btn-footer-outline">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M15 19l-7-7 7-7"/>
          </svg>
          Prev
        </button>
        <button id="btnNext" class="btn-footer-primary">
          Next
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M9 5l7 7-7 7"/>
          </svg>
        </button>
        <button id="btnSubmit" class="btn-footer-submit" style="display:none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 13l4 4L19 7"/>
          </svg>
          Selesai
        </button>
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
     QUESTION GRID PANEL
  ══════════════════════════════════════ -->
  <div id="qGridContainer" class="q-grid-container" style="display:none;">
    <div class="q-grid-header">
      <span>Navigasi Soal</span>
      <button id="btnCloseGrid" class="btn-close-grid">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div id="qGrid" class="q-grid"></div>
  </div>
  <div id="gridOverlay" class="grid-overlay" style="display:none;" onclick="closeGrid()"></div>

  <!-- ══════════════════════════════════════
     MODALS & OVERLAYS (Exam)
  ══════════════════════════════════════ -->

  <!-- Broadcast Modal -->
  <div id="broadcast-overlay" class="broadcast-overlay" style="display:none;"></div>
  <div id="broadcast-modal" class="broadcast-modal" style="display:none;">
    <div class="broadcast-content">
      <div class="broadcast-icon">📢</div>
      <h3>Pengumuman dari Proktor</h3>
      <p id="broadcast-text"></p>
      <button class="btn btn-primary" onclick="closeBroadcastModal()">Saya Mengerti</button>
    </div>
  </div>

  <!-- Zoom Modal -->
  <div id="zoom-overlay" class="zoom-overlay" style="display:none;" onclick="closeZoomModal()"></div>
  <div id="zoom-modal" class="zoom-modal" style="display:none;">
    <img id="zoom-image" src="" alt="">
  </div>

  <!-- Cheat Alert -->
  <div id="cheat-alert-overlay" class="cheat-alert-overlay" style="display:none;">
    <div class="cheat-alert-content">
      <div class="cheat-icon">⚠️</div>
      <h3>Peringatan Pelanggaran</h3>
      <p>Anda terdeteksi melakukan aktivitas mencurigakan.</p>
      <div id="cheat-countdown" class="cheat-countdown">3</div>
      <p class="cheat-sub">Ujian akan ditutup otomatis jika pelanggaran berlanjut</p>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay" style="display:none;">
    <div class="loader-container">
      <div class="spinner"></div>
      <p id="loading-overlay-text" style="color:var(--text-muted);font-size:0.875rem;margin-top:8px;">Memuat soal...</p>
    </div>
  </div>

  <!-- Custom Alert Modal -->
  <div id="custom-alert-modal" class="custom-alert-overlay" style="display:none;">
    <div class="custom-alert-card">
      <div id="custom-alert-icon" style="font-size:2.5rem;margin-bottom:12px;">⚠️</div>
      <h3 id="custom-alert-title" style="margin:0 0 8px 0;font-size:1rem;"></h3>
      <p id="custom-alert-message" style="font-size:0.85rem;color:var(--text-muted);margin:0 0 20px 0;white-space:pre-wrap;line-height:1.5;"></p>
      <div id="custom-alert-actions" style="display:flex;gap:10px;">
        <button id="custom-alert-cancel" class="btn btn-outline btn-block" onclick="closeCustomAlert(false)" style="padding:10px;display:none;">Batal</button>
        <button id="custom-alert-ok" class="btn btn-primary btn-block" onclick="closeCustomAlert(true)" style="padding:10px;">OK</button>
      </div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- PHASE 1-3: OPTIMIZATION -->
  <!-- ============================================ -->
  
  <!-- Lazy Loading -->
  <script src="lazy-loading-core.js"></script>
  <link rel="stylesheet" href="lazy-loading.css">
  <script src="sw-image-cache.js"></script>

  <!-- ============================================ -->
  <!-- PHASE 4: ADVANCED SERVICE WORKER -->
  <!-- ============================================ -->
  
  <!-- Predictive Cache & Differential Sync -->
  <script src="predictive-cache.js"></script>
  <script src="differential-sync.js"></script>
  <script src="data-compression.js"></script>
  <script src="exam-advanced-integration.js"></script>

  <!-- ============================================ -->
  <!-- EXISTING SCRIPTS -->
  <!-- ============================================ -->
  
  <script src="supabase-adapter.js?v=2"></script>
  <script src="supabase-patch.js?v=8"></script>
  <script src="script.js?v=10"></script>
  <script src="exam-core.js?v=4"></script>

  <!-- ============================================ -->
  <!-- PHASE 5: ADVANCED ES MODULES -->
  <!-- ============================================ -->
  
  <!-- Module Initialization -->
  <script type="module" src="/modules-init.js"></script>

  <!-- ============================================ -->
  <!-- PHASE 6: DATABASE OPTIMIZATION -->
  <!-- ============================================ -->
  
  <!-- Database & Redis Connection -->
  <script src="/db-pool.js"></script>
  <script src="/redis-cache.js"></script>

  <!-- ============================================ -->
  <!-- PHASE 7: REAL-TIME OPTIMIZATION -->
  <!-- ============================================ -->
  
  <!-- Real-time Sync -->
  <script src="/realtime-sync.js"></script>

  <!-- ============================================ -->
  <!-- PHASE 9: MONITORING & ANALYTICS -->
  <!-- ============================================ -->
  
  <!-- Performance Monitoring & Error Tracking -->
  <script src="/performance-monitor.js"></script>
  <script src="/error-tracker.js"></script>

  <!-- ============================================ -->
  <!-- SERVICE WORKER REGISTRATION -->
  <!-- ============================================ -->
  
  <script>
    // Register Service Workers
    if ('serviceWorker' in navigator) {
      // Phase 4: Advanced Service Worker (includes image cache)
      navigator.serviceWorker.register('/sw-advanced.js')
        .then(reg => console.log('✅ Advanced SW registered (includes image cache)'))
        .catch(err => console.error('❌ Advanced SW error:', err));
    }
  </script>

  <!-- ============================================ -->
  <!-- MODULE READY LISTENER -->
  <!-- ============================================ -->
  
  <script>
    // Wait for modules to be ready
    window.addEventListener('modulesReady', (e) => {
      console.log('✅ All modules ready');
      console.log('Available modules:', Object.keys(e.detail));
      
      // Initialize application
      if (window.stateManager) {
        window.stateManager.init();
      }
      
      if (window.performanceMonitor) {
        window.performanceMonitor.start();
      }
      
      if (window.syncManager) {
        window.syncManager.connect();
      }
    });
    
    // Handle module errors
    window.addEventListener('modulesError', (e) => {
      console.error('❌ Module initialization failed:', e.detail.error);
    });
  </script>

  <!-- ============================================ -->
  <!-- INITIALIZATION COMPLETE -->
  <!-- ============================================ -->
  
  <script>
    console.log('✅ All optimization scripts loaded (Phase 1-9)');
    console.log('✅ Application ready for Phase 1-9');
  </script>
</body>
</html>
