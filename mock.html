  <script>
    const toast=document.getElementById('toast');let t;function show(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(t);t=setTimeout(()=>toast.classList.remove('show'),1700)}
    document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>show(el.dataset.action+' dibuka')));
    document.querySelectorAll('.start').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();show(btn.classList.contains('disabled')?'Ujian belum waktunya':'Memulai ujian...')}));
    document.querySelectorAll('.star').forEach(s=>s.addEventListener('click',e=>{e.stopPropagation();s.classList.toggle('fav');s.style.color=s.classList.contains('fav')?'#ffa000':'';show(s.classList.contains('fav')?'Ditambahkan favorit':'Dihapus dari favorit')}));
    document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');show('Tab '+b.dataset.tab)}));
    document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.exam').forEach(card=>{card.style.display=card.dataset.title.toLowerCase().includes(q)?'grid':'none'})});
  </script>
