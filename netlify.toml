# Netlify Configuration for CBT Optimization Project
# Phase 1-9 Deployment

[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 8888

# ============================================
# REDIRECTS
# ============================================

# Redirect all requests to index.html for SPA
[[redirects]]
  from = "/*"
  to = "/exam.html"
  status = 200

# API redirects (for Phase 5-7)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ============================================
# CACHE HEADERS
# ============================================

# Cache static assets (long-term)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Don't cache HTML (always check for updates)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Don't cache Service Workers (always check for updates)
[[headers]]
  for = "/sw-*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache API responses (short-term)
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# ============================================
# SECURITY HEADERS
# ============================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ============================================
# COMPRESSION
# ============================================

# Note: Netlify handles compression automatically
# Do not set Content-Encoding header manually

# ============================================
# CONTEXT-SPECIFIC SETTINGS
# ============================================

# Production context
[context.production]
  command = "npm run build"
  publish = "public"

# Preview context
[context.deploy-preview]
  command = "npm run build"
  publish = "public"

# Branch deploy context
[context.branch-deploy]
  command = "npm run build"
  publish = "public"

# ============================================
# ENVIRONMENT VARIABLES
# ============================================

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  CACHE_TTL = "3600"

# ============================================
# PLUGINS
# ============================================

# Optional: Add Netlify plugins for additional features
# [[plugins]]
#   package = "@netlify/plugin-lighthouse"
#
